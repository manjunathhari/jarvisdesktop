[workspace]
resolver = "2"
members = ["crates/jarvis-core", "crates/jarvis-modules", "crates/jarvis-brain", "crates/jarvis-voice", "crates/jarvis-fetch", "crates/jarvis-ears", "crates/jarvis-node", "crates/jarvis-helper", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
toml = "0.8"
jarvis-core = { path = "crates/jarvis-core" }
jarvis-brain = { path = "crates/jarvis-brain" }
jarvis-modules = { path = "crates/jarvis-modules" }
jarvis-voice = { path = "crates/jarvis-voice" }
jarvis-fetch = { path = "crates/jarvis-fetch" }
jarvis-ears = { path = "crates/jarvis-ears" }
jarvis-node = { path = "crates/jarvis-node" }
jarvis-helper = { path = "crates/jarvis-helper" }
# The node protocol (Plan B): signing, shared vectors, wire types.
# RFC 8785 JCS; sorts keys by UTF-16 code units (R12-35: replaces serde_jcs, whose key order is wrong).
serde_json_canonicalizer = "0.4"
ed25519-dalek = "2"
sha2 = "0.10"
data-encoding = "2"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
zeroize = "1"

# Signature checks in debug builds are ~50x slower without optimisation, slow enough to delay
# heartbeat replies under load (R12-10). Optimise just the crypto crates in dev builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
