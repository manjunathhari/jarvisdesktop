# JARVIS claude-proxy (profile "improve"). The sandbox holds no key: the Claude Agent SDK there
# talks plain HTTP to ANTHROPIC_BASE_URL=http://claude-proxy:8080 with a placeholder key, and this
# proxy forwards /v1/ to https://api.anthropic.com with the team's own key (secret
# improve_claude_key, a Console workspace of its own, not core's anthropic_api_key). Nothing
# else is forwarded, and the sandbox's own Authorization header never passes.
#
# The key line is not in this file. The container's start command reads the secret file, checks
# it holds only key characters, and writes `proxy_set_header x-api-key "...";` to
# /tmp/claude-key.conf (tmpfs, mode 0600), which is included below.
#
# The container's only internet route is its own network, jarvis_claude_egress. The upstream is
# fixed here, so a client can't choose another host; the name is re-resolved through Docker's DNS.
#
# compose.yaml carries an inline copy of this file (x-claude-proxy-nginx, with $$ written as
# $$$$), passed in as JARVIS_NGINX_CONF and written to /tmp/nginx.conf at start, because the
# container is read-only and Compose can't place an inline config file in it.
# tests/test_compose.py checks the two match.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=60s ipv6=off;
    client_max_body_size 64m;

    server {
        listen 8080;

        location = /healthz {
            return 200 "ok\n";
        }

        location /v1/ {
            set $claude https://api.anthropic.com;
            proxy_pass $claude;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host api.anthropic.com;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Connection "";
            include /tmp/claude-key.conf;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location / {
            return 404;
        }
    }
}
