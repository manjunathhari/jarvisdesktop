# Brain model prices, in paise per million tokens (spec §10.1, R12-12).
#
# Anthropic list prices (platform.claude.com/docs/en/about-claude/pricing), USD converted at ₹100/$, 23 Nov 2026.
#
# Opus 5.5: $4 input / $20 output per million tokens; Sonnet 5.5: $2 / $10. ₹100 per dollar is
# deliberately above mid-market (about ₹95 on 23 Nov 2026), to cover card markup and tax.
# Haiku 5.5 is left out on purpose: its prices are tiered by prompt length, so it fails closed
# (UnknownModelPrice) until tier support is added. A model missing here is never called.
# Prices and the rate change only by editing this file, with the source and date noted above.

# The brain model Jarvis uses (Task 10 reads it). Opus (owner, 25 Nov evening: after trying
# Sonnet, "Opus was better"). Sonnet stays in the table.
default_model = "claude-opus-5-5"

[models.claude-opus-5-5]
input = 40000
output = 200000

[models.claude-sonnet-5-5]
input = 20000
output = 100000

# Tools Anthropic runs and bills per use, in paise per use. Web search: $10 per 1,000 searches
# (platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool, "Usage and pricing",
# read 26 Nov 2026), at the same ₹100/$: 100 paise a search. A failed search is not billed. The
# pages a search returns are billed as input tokens, at the model's price. A tool missing here
# is never offered to the model (UnknownToolPrice).
[tools.web_search]
per_use = 100
