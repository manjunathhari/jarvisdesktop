[project]
name = "jarvis-voice-helper"
version = "1.0.0"
description = "JARVIS voice helper: speaks text for the desktop app over JSON lines on stdin/stdout"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[kokoro]==1.17.0",
]

[project.optional-dependencies]
audio = ["pipecat-ai[local]==1.17.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_voice_helper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
