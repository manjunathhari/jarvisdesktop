<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-mode="idle" data-mic="on">
    <main id="wall" aria-live="polite"></main>

    <div id="overlay" hidden></div>

    <footer id="presence">
      <p id="heard"></p>
      <p id="said"></p>
      <button id="orb" aria-label="Tap to talk to JARVIS"><span></span></button>
      <form id="devtype" hidden>
        <input id="devinput" autocomplete="off" placeholder="Type what you'd say, then Enter" />
      </form>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
