[package]
name = "jarvis-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jarvis-core.workspace = true
jarvis-fetch.workspace = true
tracing.workspace = true
rodio = { version = "0.20", default-features = false }

# The Kokoro engine (sherpa-onnx) is built on Windows only: its build downloads
# prebuilt libraries. Version 1.x keeps espeak-ng so any word can be pronounced.
[target.'cfg(windows)'.dependencies]
sherpa-onnx = "=1.13.2"
sherpa-onnx-sys = "=1.13.2"  # must match sherpa-onnx exactly
