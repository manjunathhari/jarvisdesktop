[package]
name = "jarvis-cad-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs the CAD engine for the JARVIS server: one replay per connection, inside the locked-down cad container."

[dependencies]
serde.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
