name: CAD engine
# The `cad` image: the pinned CAD engine (CADCraft cadcraft-cli) and jarvis-cad-runner.
# Plan: .10x/plans/2026-11-28-cad-board-slice-1.md, Task 2. The engine is third-party code: it
# runs only on this runner (real-engine tests) and inside the locked-down container.
# Triggers: pull requests run only when these paths change; pushes run on every branch, and
# the `changes` job below applies the same paths to every branch except main. A push to main
# always runs, so an image is published for every main commit (the server deploys by commit).
on:
  push:
    branches: ['**']
  pull_request:
    paths: ['crates/jarvis-cad-runner/**', 'server/deploy/cad.Dockerfile', 'server/deploy/cad.Dockerfile.dockerignore', 'server/config/cad_commands.txt', '.github/workflows/cad.yml', 'Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

env:
  CADCRAFT_VERSION: "0.12.0"
  # From the release's SHA256SUMS.txt, read on 27 Nov 2026. A different file fails the job.
  CADCRAFT_SHA256: 6ae27b9eabc3608caef356a00f69b9fdccbf1e408d6308b5614b6e6b256308de

jobs:
  changes:
    # Whether the rest runs: always for pull requests (filtered above) and pushes to main;
    # for pushes to other branches, only when the paths in `pull_request` changed.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths='^(crates/jarvis-cad-runner/|server/deploy/cad\.Dockerfile(\.dockerignore)?$|server/config/cad_commands\.txt$|\.github/workflows/cad\.yml$|Cargo\.(toml|lock)$)'
          run=true
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            base=""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
            else
              base="$(git merge-base origin/main "$SHA" 2>/dev/null || true)"
            fi
            if [ -n "$base" ]; then
              changed="$(git diff --name-only "$base" "$SHA")"
              if grep -Eq "$paths" <<<"$changed"; then run=true; else run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$EVENT on $REF: run=$run"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p jarvis-cad-runner --all-targets -- -D warnings
      - name: Tests (against the stand-in engine)
        run: cargo test -p jarvis-cad-runner
      - name: Download the pinned engine and verify its checksum
        # Kept outside the checkout, unpacked in its own empty directory.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cadcraft"
          mkdir -p "$dir/download" "$dir/unpack" "$dir/bin"
          file="cadcraft-${CADCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/download/$file" \
            "https://github.com/storytold/cadcraft/releases/download/v${CADCRAFT_VERSION}/${file}"
          (cd "$dir/download" && echo "${CADCRAFT_SHA256}  ${file}" | sha256sum -c -)
          tar -xzf "$dir/download/$file" -C "$dir/unpack"
          cli="$(find "$dir/unpack" -type f -name cadcraft-cli | head -n 1)"
          test -n "$cli"
          install -m 0755 "$cli" "$dir/bin/cadcraft-cli"
      - name: Tests against the real engine
        run: cargo test -p jarvis-cad-runner --test real_engine -- --nocapture
        env:
          JARVIS_CAD_ENGINE: ${{ runner.temp }}/cadcraft/bin/cadcraft-cli
          # The tests fail, not skip, if the engine above is missing.
          JARVIS_CAD_ENGINE_REQUIRED: "1"

  image:
    needs: [changes, test]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image builds
        run: docker build --file server/deploy/cad.Dockerfile --tag jarvis-cad:ci .
      - name: Start it locked down, on an internal network with no route out
        run: |
          docker network create --internal cad-smoke
          docker run --detach --name cad --network cad-smoke \
            --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --pids-limit 128 --user 10001:10001 \
            jarvis-cad:ci
      - name: Replay the canned two-room plan from a second container
        run: |
          docker run --rm -i --network cad-smoke python:3.12-slim python - <<'PY'
          import base64, json, socket, sys, time

          def ask(request):
              deadline = time.monotonic() + 20
              while True:
                  try:
                      sock = socket.create_connection(("cad", 7411), timeout=5)
                      break
                  except OSError:
                      if time.monotonic() > deadline:
                          raise
                      time.sleep(0.5)
              with sock:
                  sock.settimeout(30)
                  sock.sendall(json.dumps(request).encode() + b"\n")
                  data = b""
                  while not data.endswith(b"\n"):
                      chunk = sock.recv(65536)
                      if not chunk:
                          break
                      data += chunk
              return json.loads(data)

          catalogue = ask({"v": 1, "op": "catalogue"})
          print("catalogue:", catalogue.get("ok"), catalogue.get("engine_version"), len(catalogue.get("commands") or {}), "commands")
          if catalogue.get("ok") is not True or len(catalogue.get("commands") or {}) != 37:
              print(json.dumps(catalogue)[:2000])
              sys.exit("the catalogue did not answer with the 37 allowed commands")

          plan = [
              {"command": "setvar", "params": {"name": "DIMSCALE", "value": 40}},
              {"command": "line", "params": {"points": [[0, 0], [9000, 0], [9000, 7000], [0, 7000]], "closed": True}},
              {"command": "line", "params": {"points": [[5000, 0], [5000, 7000]]}},
              {"command": "text", "params": {"at": [600, 6200], "text": "LIVING ROOM", "height": 200}},
              {"command": "text", "params": {"at": [5600, 6200], "text": "BEDROOM", "height": 200}},
              {"command": "dimlinear", "params": {"p1": [0, 0], "p2": [9000, 0], "at": [4500, -900]}},
              {"command": "dimlinear", "params": {"p1": [9000, 0], "p2": [9000, 7000], "at": [9900, 3500]}},
          ]
          began = time.monotonic()
          answer = ask({"v": 1, "op": "replay", "picture": True, "steps": [{"label": "Whole plan", "commands": plan}]})
          took = time.monotonic() - began
          svg = base64.b64decode(answer.get("svg_b64") or "")
          print("replay:", answer.get("ok"), "failed", answer.get("failed"), "counts", answer.get("counts"),
                "texts", answer.get("texts"), "svg", len(svg), "bytes", f"{took:.2f} s")
          if answer.get("ok") is not True or answer.get("failed") != 0 or not svg:
              print(json.dumps(answer)[:2000])
              sys.exit("the replay did not answer ok with an SVG")
          PY
      - name: Nothing is left running after a replay
        run: |
          set -euo pipefail
          docker top cad -eo pid,user,comm
          count="$(docker top cad -eo pid | tail -n +2 | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::the cad container runs $count processes after a replay; only the runner may be left"
            exit 1
          fi
      - name: There is no route out of the container
        run: |
          set -euo pipefail
          # A public address, looked up here on the CI runner (none is written in this file).
          target="$(getent ahostsv4 github.com | awk 'NR == 1 { print $1 }')"
          test -n "$target"
          # The check itself must work: from the CI runner the same connection succeeds, and
          # bash (with /dev/tcp) and timeout exist in the image.
          timeout 5 bash -c "exec 3<>/dev/tcp/$target/443"
          docker exec cad bash -c 'command -v timeout >/dev/null && echo "the check can run"'
          if docker exec cad timeout 5 bash -c "exec 3<>/dev/tcp/$target/443"; then
            echo "::error::the cad container opened a TCP connection to $target:443"
            exit 1
          fi
          echo "no route out: the connection from inside cad failed, as it must"
      - name: Three replays in a row leave /tmp empty
        run: |
          docker run --rm -i --network cad-smoke python:3.12-slim python - <<'PY'
          import json, socket, sys

          def ask(request):
              with socket.create_connection(("cad", 7411), timeout=5) as sock:
                  sock.settimeout(30)
                  sock.sendall(json.dumps(request).encode() + b"\n")
                  data = b""
                  while not data.endswith(b"\n"):
                      chunk = sock.recv(65536)
                      if not chunk:
                          break
                      data += chunk
              return json.loads(data)

          plan = [
              {"command": "line", "params": {"points": [[0, 0], [9000, 0], [9000, 7000], [0, 7000]], "closed": True}},
              {"command": "text", "params": {"at": [600, 6200], "text": "LIVING ROOM", "height": 200}},
          ]
          for n in range(3):
              answer = ask({"v": 1, "op": "replay", "picture": True, "steps": [{"label": "Room", "commands": plan}]})
              print("replay", n + 1, ":", answer.get("ok"), "failed", answer.get("failed"), "svg", bool(answer.get("svg_b64")))
              if answer.get("ok") is not True or answer.get("failed") != 0 or not answer.get("svg_b64"):
                  print(json.dumps(answer)[:2000])
                  sys.exit("a replay in the row did not answer ok with an SVG")
          PY
          left="$(docker exec cad ls -A /tmp)"
          if [ -n "$left" ]; then
            echo "::error::left in /tmp after the replays: $left"
            exit 1
          fi
          echo "/tmp is empty"
          count="$(docker top cad -eo pid | tail -n +2 | wc -l)"
          test "$count" -eq 1
      - name: Runner log
        if: always()
        run: docker logs cad || true

  publish:
    # After the tests and the image check pass on main, publish the image the server pulls,
    # tagged with the commit (the server deploys by JARVIS_REF = commit SHA). Pushes to main
    # are not path-filtered, so every main commit gets an image.
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/deploy/cad.Dockerfile
          push: true
          tags: ghcr.io/manjunathhari/jarvis-cad:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/manjunathhari/jarvisdesktop
            org.opencontainers.image.description=JARVIS cad engine runner (CADCraft 0.12.0)
