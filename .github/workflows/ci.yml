name: CI
on:
  push:
    paths-ignore: ['server/**', 'contracts/**', '.10x/**', '.github/workflows/server.yml', 'helper/**', '.github/workflows/helper.yml']
  pull_request:
    paths-ignore: ['server/**', 'contracts/**', '.10x/**', '.github/workflows/server.yml', 'helper/**', '.github/workflows/helper.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-onnx-sys downloads its native libraries into target/sherpa-onnx-prebuilt,
          # which rust-cache does not keep by default. Keep it with the cache.
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Re-run the sherpa-onnx build script if its libraries are missing
        # A restored cache can hold the build script's old output (a link path) without the
        # libraries it points at; linking then fails with "could not find native static
        # library sherpa-onnx-c-api". Cleaning the crate makes the build script download them.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path target/sherpa-onnx-prebuilt)) { cargo clean -p sherpa-onnx-sys }
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build UI
        working-directory: app
        run: |
          npm ci
          npm run build
          npx vitest run
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # --no-fail-fast: run every test binary, so one failure doesn't hide the others.
        run: cargo test --workspace --no-fail-fast
