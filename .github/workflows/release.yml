name: Windows installer
# Builds JARVIS-setup.exe on every push to milestone-a/main (or on demand)
# and publishes it as a pre-release on the repo's Releases page.
on:
  push:
    branches: [main, milestone-a]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: jarvis-v__VERSION__-build.${{ github.run_number }}
          releaseName: "JARVIS build ${{ github.run_number }}"
          releaseBody: "Download JARVIS_..._x64-setup.exe below, double-click to install. Windows may warn that the app is unrecognised: click More info → Run anyway."
          releaseDraft: false
          prerelease: true
