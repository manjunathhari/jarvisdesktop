name: Voice helper
# Tests the voice helper on Linux and Windows, freezes it with PyInstaller on Windows, proves the
# FROZEN program can speak (its self-test), and, when a voice-helper-v* tag is pushed, publishes
# it to the release for that tag (the release job creates the release if the owner has not).
on:
  push:
    # `branches` must be listed too: with only `tags` set, branch pushes would not run at all.
    # The paths filter applies to branch pushes only; a tag push runs whatever the paths are.
    branches: ['**']
    paths: ['helper/**', '.github/workflows/helper.yml']
    tags: ['voice-helper-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  KOKORO_BASE: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Linux deps for PyAudio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      - name: Install
        run: uv sync --extra audio
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Test
        run: uv run pytest -v

  freeze:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install
        run: uv sync --extra audio
      - name: Freeze
        run: uv run pyinstaller jarvis-voice-helper.spec --noconfirm
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kokoro
          key: kokoro-onnx-v1.0
      - name: Download Kokoro model files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            if [ ! -s "$RUNNER_TEMP/kokoro/$f" ]; then
              curl -L --fail -o "$RUNNER_TEMP/kokoro/$f" "$KOKORO_BASE/$f"
            fi
          done
          ls -l "$RUNNER_TEMP/kokoro"
      - name: Check the Kokoro files against their pins
        # An independent check that the pins in crates/jarvis-helper/src/install.rs match what the
        # upstream release serves. Bare file names: $RUNNER_TEMP has backslashes on Windows.
        shell: bash
        run: |
          cd "$RUNNER_TEMP/kokoro"
          sha256sum -c <<'EOF'
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin
          EOF
      - name: Self-test the frozen program
        # Fails the job unless the frozen exe speaks and its sound library is bundled.
        shell: bash
        run: |
          dist/jarvis-voice-helper/jarvis-voice-helper.exe --selftest "$RUNNER_TEMP/out.wav" \
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            --require-audio-lib
      - name: Smoke-test the frozen program's loop
        # The real stdin/stdout loop with the real voice and a null audio output: catches native
        # libraries that hang while the stdin reader is blocked.
        shell: bash
        run: |
          uv run python tests/smoke_loop.py --exe dist/jarvis-voice-helper/jarvis-voice-helper.exe \
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
      - name: Pack
        shell: bash
        run: |
          tar -cjf jarvis-voice-helper-win-x64.tar.bz2 -C dist jarvis-voice-helper
          tar -tjf jarvis-voice-helper-win-x64.tar.bz2 | grep -x 'jarvis-voice-helper/jarvis-voice-helper.exe'
          sha=$(sha256sum jarvis-voice-helper-win-x64.tar.bz2 | cut -d' ' -f1)
          size=$(stat -c %s jarvis-voice-helper-win-x64.tar.bz2)
          {
            echo "### jarvis-voice-helper-win-x64.tar.bz2"
            echo ""
            echo "- SHA-256: \`$sha\`"
            echo "- Size: $size bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $sha"
          echo "Size: $size bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-helper-win-x64
          path: helper/jarvis-voice-helper-win-x64.tar.bz2
          if-no-files-found: error

  release:
    needs: freeze
    if: startsWith(github.ref, 'refs/tags/voice-helper-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-voice-helper-win-x64
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset=jarvis-voice-helper-win-x64.tar.bz2
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          # Only this probe may fail. A network/auth error is indistinguishable from "no release"
          # here, and then we try to create one: that is safe, because `gh release create
          # --verify-tag` fails if the release does exist, so nothing is ever replaced.
          exists=0
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || exists=1
          if [ "$exists" -eq 0 ]; then
            # No --clobber: if the asset is already there this fails, and so does the job.
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            notes_file=$(mktemp)
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file"
            printf '\n\nSHA-256 of %s: %s\n' "$asset" "$sha" >> "$notes_file"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            how="uploaded to the existing release"
          else
            gh release create "$TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "JARVIS voice helper $TAG" \
              --notes "Windows x64 build of the JARVIS voice helper.

          SHA-256 of jarvis-voice-helper-win-x64.tar.bz2: $sha"
            how="created the release"
          fi
          {
            echo "### Release $TAG"
            echo ""
            echo "- Result: $how"
            echo "- SHA-256 of $asset: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
