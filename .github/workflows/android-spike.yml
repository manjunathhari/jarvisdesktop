name: Android spike (throwaway)
# Slice 0 of the phone node design (26 Nov 2026): builds a test app for Manj's phone.
# Lives only on the spike-android branch. Never merged.
on:
  push:
    branches: [spike-android]
  workflow_dispatch:

permissions:
  contents: write # to publish the test app as a pre-release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rust: aarch64, abi: arm64-v8a }   # the phone
          - { rust: x86_64, abi: x86_64 }       # the emulator, to see start-up failures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-spike-${{ matrix.rust }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point at the Android NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Fetch sherpa-onnx's Android libraries
        run: |
          mkdir -p "$RUNNER_TEMP/sherpa"
          curl -fsSL -o "$RUNNER_TEMP/sherpa.tar.bz2" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-v1.13.2-android.tar.bz2
          tar xjf "$RUNNER_TEMP/sherpa.tar.bz2" -C "$RUNNER_TEMP/sherpa"
          ls -l "$RUNNER_TEMP/sherpa/jniLibs/${{ matrix.abi }}"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa/jniLibs/${{ matrix.abi }}" >> "$GITHUB_ENV"
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Generate the Android project
        working-directory: app
        run: npx tauri android init --ci
      - name: Add the spike's Android pieces
        run: python3 spike/android/patch.py app/src-tauri/gen/android "$SHERPA_ONNX_LIB_DIR"
      - name: Build the app
        working-directory: app
        env:
          JARVIS_BUILD: spike-${{ github.run_number }}
          # Optimised and without debug data: honest speed and battery numbers, smaller download.
          CARGO_PROFILE_DEV_OPT_LEVEL: 3
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_DEV_STRIP: symbols
        run: npx tauri android build --debug --apk --target ${{ matrix.rust }} --ci
      - name: Check what is inside the app file
        run: |
          apk=$(find app/src-tauri/gen/android -name '*.apk' | head -1)
          ls -l "$apk"
          unzip -l "$apk" | grep -E '\.so$|AndroidManifest'
          for lib in libjarvis_app.so libsherpa-onnx-c-api.so libonnxruntime.so libc++_shared.so; do
            unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/$lib" || { echo "missing $lib"; exit 1; }
          done
      - name: Let the emulator use hardware acceleration
        if: matrix.rust == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app in an emulator and read its log
        if: matrix.rust == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash spike/android/emulator-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-spike-apk-${{ matrix.abi }}
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish as a pre-release (direct download for the phone)
        if: matrix.rust == 'aarch64' && contains(github.event.head_commit.message, '[publish]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find app/src-tauri/gen/android -name '*.apk' | head -1)
          cp "$apk" JARVIS-spike-android.apk
          gh release create "spike-android-${{ github.run_number }}" JARVIS-spike-android.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "JARVIS Android spike ${{ github.run_number }} (test build)" \
            --notes "Throwaway test build for the phone node spike. Not a product release. Download JARVIS-spike-android.apk on the phone and install it."
