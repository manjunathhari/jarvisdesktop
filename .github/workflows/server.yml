name: Server
on:
  push:
    paths: ['server/**', 'contracts/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'contracts/**', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JARVIS_TEST_SUPERUSER_DSN: postgresql://postgres:ci-superuser@localhost:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (P0-1 … P0-6 and unit tests)
        run: uv run pytest -v
      - name: Compose file is valid
        run: docker compose -f deploy/compose.yaml config --quiet
        env:
          JARVIS_REF: ${{ github.sha }}
      - name: Image builds
        run: docker build --tag jarvis-server:ci .

  publish:
    # After tests pass on main, publish the image the server pulls,
    # tagged with the commit (the server deploys by JARVIS_REF = commit SHA).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/manjunathhari/jarvis-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/manjunathhari/jarvisdesktop
            org.opencontainers.image.description=JARVIS server (Architecture v2)
