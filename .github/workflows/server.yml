name: Server
on:
  push:
    paths: ['server/**', 'contracts/**', 'crates/jarvis-node/**', 'crates/jarvis-core/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'contracts/**', 'crates/jarvis-node/**', 'crates/jarvis-core/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JARVIS_TEST_SUPERUSER_DSN: postgresql://postgres:ci-superuser@localhost:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing vectors are reproducible (independent generator)
        working-directory: contracts/signing-vectors
        run: |
          npm ci
          node generate.mjs vectors > /tmp/v.json
          node generate.mjs authz-cases > /tmp/a.json
          diff vectors.json /tmp/v.json
          diff authz-cases.json /tmp/a.json
      - name: Install
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Rust node probe (plan B Task 9, D-3)
        working-directory: .
        run: cargo build -p jarvis-node --features test-support --bin jarvis-node-probe
      - name: Tests (P0-1 … P0-6, unit tests, and the Rust node end to end)
        run: uv run pytest -v
        env:
          JARVIS_NODE_PROBE: ${{ github.workspace }}/target/debug/jarvis-node-probe
      - name: Compose file is valid
        run: docker compose -f deploy/compose.yaml config --quiet
        env:
          JARVIS_REF: ${{ github.sha }}
      - name: Read-only sidecars really start (egress proxy, Tailscale sidecar)
        run: uv run pytest -v tests/test_compose_live.py
        env:
          JARVIS_DOCKER_LIVE: '1'
      - name: No service publishes a port (P0-8, P2-S5)
        run: |
          docker compose -f deploy/compose.yaml --profile '*' config > "$RUNNER_TEMP/compose.yaml"
          if grep -nE '^\s*ports:' "$RUNNER_TEMP/compose.yaml"; then
            echo "deploy/compose.yaml must not publish ports" >&2
            exit 1
          fi
        env:
          JARVIS_REF: ${{ github.sha }}
      - name: Image builds
        run: docker build --tag jarvis-server:ci .
      - name: Sandbox image builds (improve profile; built only, never pushed)
        run: docker build -f deploy/improve/sandbox.Dockerfile --tag jarvis-sandbox:ci .
      # The next two run the sandbox image the way compose runs it (its own environment,
      # read-only root, tmpfs, uid 10001, no capabilities), without starting the other services.
      - name: The sandbox can't see any key (improve key check, in the sandbox image)
        run: |
          docker tag jarvis-sandbox:ci "ghcr.io/manjunathhari/jarvis-sandbox:${JARVIS_REF}"
          docker compose -f deploy/compose.yaml --profile improve run --rm --no-deps -T \
            sandbox --check
        env:
          JARVIS_REF: ${{ github.sha }}
      - name: Dry run of one ticket through the whole team (in the sandbox image)
        run: |
          docker compose -f deploy/compose.yaml --profile improve run --rm --no-deps -T \
            --entrypoint /opt/agent-sdk/bin/python sandbox -m jarvis_server.improve.dry_run
        env:
          JARVIS_REF: ${{ github.sha }}

  publish:
    # After tests pass on main, publish the image the server pulls,
    # tagged with the commit (the server deploys by JARVIS_REF = commit SHA).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/manjunathhari/jarvis-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/manjunathhari/jarvisdesktop
            org.opencontainers.image.description=JARVIS server (Architecture v2)
