# Brain evaluation cases. Judged against eval::EVAL_SCREEN (stories 1–9, NDTV playing).
# `expect` = action the brain's FIRST tool call must be; "none" = no tool call.
# `args` = values that must be present (strings compared case-insensitively).
# Target from the plan: ~30 per action; this first set has ~10 per action. Extend with
# real phrasings the user actually says once JARVIS is in daily use.

# ── show_news ────────────────────────────────────────────────
[[case]]
say = "Bring me the latest news"
expect = "show_news"
[[case]]
say = "What's happening today?"
expect = "show_news"
[[case]]
say = "Show me the headlines"
expect = "show_news"
[[case]]
say = "Any news?"
expect = "show_news"
[[case]]
say = "Give me today's top stories"
expect = "show_news"
[[case]]
say = "What's going on in the world"
expect = "show_news"
args = { region = "world" }
[[case]]
say = "Just the Indian news please"
expect = "show_news"
args = { region = "india" }
[[case]]
say = "Show me international news only"
expect = "show_news"
args = { region = "world" }
[[case]]
say = "Anything about cricket?"
expect = "show_news"
args = { topic = "cricket" }
[[case]]
say = "What's the news on Bengaluru"
expect = "show_news"
args = { topic = "bengaluru" }
[[case]]
say = "Refresh the news"
expect = "show_news"
[[case]]
say = "Update me on current affairs"
expect = "show_news"

